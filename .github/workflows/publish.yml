# Created by Kiro
# This GitHub Actions workflow publishes the module to the PowerShell Gallery,
# Main is protected, and items in pr-quality-gate workflow must be completed before this workflow will trigger.

name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.6.0). Must already exist. When triggered from UI, select the tag as the ref instead."
        required: false
        type: string
      dry_run:
        description: "Run with -WhatIf (no actual publish)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  checks: read

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine effective tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          # Priority: explicit input (workflow_dispatch only) > ref_name (push-tag or dispatch-on-tag)
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TAG" == v* ]]; then
            TAG="$REF_TAG"
          else
            echo "::error::Unable to determine tag. Either push a tag, select a tag ref, or provide the 'tag' input."
            exit 1
          fi

          # Normalize: strip refs/tags/ prefix if accidentally included
          TAG="${TAG#refs/tags/}"

          # Validate the resolved tag exists
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist. Ensure the tag has been pushed before running this workflow."
            exit 1
          fi

          echo "Resolved tag: $TAG"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  verify-tag-signature:
    name: Verify tag GPG signature
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag is signed by authorized release key
        env:
          GPG_PUBLIC_KEY: ${{ secrets.TAG_SIGNING_GPG_PUBLIC_KEY }}
        run: |
          if [ -z "$GPG_PUBLIC_KEY" ]; then
            echo "::error::TAG_SIGNING_GPG_PUBLIC_KEY secret is not configured."
            exit 1
          fi

          # Import the trusted public key into a temporary keyring
          export GNUPGHOME="$RUNNER_TEMP/verify-keyring"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          if ! printf '%s' "$GPG_PUBLIC_KEY" | gpg --batch --import; then
            echo "::error::Failed to import TAG_SIGNING_GPG_PUBLIC_KEY."
            exit 1
          fi

          # Extract the expected key fingerprint
          EXPECTED_FPR=$(gpg --batch --list-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          echo "Trusted key fingerprint: $EXPECTED_FPR"
          
          TAG_NAME="${{ needs.resolve-tag.outputs.tag_name }}"
          TAG_REF="refs/tags/$TAG_NAME"

          # Always refresh tags from origin in case local refs are stale/overwritten
          git fetch --force --tags origin

          # Ensure the ref exists and is an annotated tag object
          OBJ_TYPE="$(git cat-file -t "$TAG_REF" 2>/dev/null || true)"
          if [ -z "$OBJ_TYPE" ]; then
            echo "::error::Tag ref '$TAG_REF' not found after fetch."
            exit 1
          fi
          if [ "$OBJ_TYPE" != "tag" ]; then
            echo "::error::'$TAG_REF' points to object type '$OBJ_TYPE' (expected 'tag'). This is a lightweight tag or ref mismatch."
            git show-ref --tags | grep -F -- "$TAG_REF" || true
            exit 1
          fi

          echo "Verifying signature on tag ref: $TAG_REF"
          if ! git verify-tag "$TAG_REF"; then
            echo "::error::Tag '$TAG_NAME' does not have a valid GPG signature."
            exit 1
          fi

          SIGNER_FPR=$(git verify-tag --raw "$TAG_REF" 2>&1 | awk '/^\[GNUPG:\] VALIDSIG/ {print $3; exit}')
          if [ "$SIGNER_FPR" != "$EXPECTED_FPR" ]; then
            echo "::error::Tag '$TAG_NAME' was signed by key $SIGNER_FPR, expected $EXPECTED_FPR."
            exit 1
          fi



          echo "✓ Tag '$TAG_NAME' is signed by the authorized release key ($EXPECTED_FPR)."

  status-checks:
    name: Verify required status checks passed
    needs: [verify-tag-signature, resolve-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify PR Quality Gate passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-tag.outputs.tag_name }}
        run: |
          COMMIT_SHA=$(git rev-list -n 1 "refs/tags/$TAG_NAME")
          echo "Checking status checks for commit: $COMMIT_SHA (tag: $TAG_NAME)"

          REQUIRED_CHECKS=("Pester Tests" "PSScriptAnalyzer" "Comment-Based Help" "Manifest Compliance")
          TIMEOUT_SECONDS=600
          POLL_INTERVAL=15

          for CHECK in "${REQUIRED_CHECKS[@]}"; do
            echo "Waiting for check to complete: $CHECK"
            ELAPSED=0
            while true; do
              RESULT=$(gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/check-runs" \
                --jq ".check_runs[] | select(.name == \"${CHECK}\") | \"\(.status)|\(.conclusion // \"\")\"" | head -1)
              STATUS="${RESULT%%|*}"
              CONCLUSION="${RESULT#*|}"

              if [ -z "$STATUS" ]; then
                echo "  Check '$CHECK' not found yet (${ELAPSED}s elapsed), waiting..."
              elif [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ] || [ "$STATUS" = "waiting" ] || [ "$STATUS" = "pending" ]; then
                echo "  Check '$CHECK' is $STATUS (${ELAPSED}s elapsed), waiting..."
              else
                break
              fi

              if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
                echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for check '$CHECK' to complete."
                exit 1
              fi

              sleep "$POLL_INTERVAL"
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
            done

            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::Required check '$CHECK' has not passed (conclusion: ${CONCLUSION:-not found}). Ensure the PR quality gate workflow completed successfully before tagging a release."
              exit 1
            fi
            echo "  ✓ $CHECK passed"
          done

          echo "All required status checks passed."

  validate-version:
    name: Verify tag matches module version
    needs: [status-checks, resolve-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}

      - name: Compare tag to ModuleVersion in manifest
        shell: pwsh
        env:
          TAG_NAME: ${{ needs.resolve-tag.outputs.tag_name }}
        run: |
          # Strip the leading 'v' from the tag to get the expected version string
          $tag = $env:TAG_NAME
          $tagVersion = $tag -replace '^v', ''

          # Import the manifest and build the full version string
          $manifest = Import-PowerShellDataFile -Path './src/CharlandCustomizations/CharlandCustomizations.psd1'
          $moduleVersion = $manifest.ModuleVersion
          $prerelease = $manifest.PrivateData.PSData.Prerelease

          if ($prerelease) {
              $manifestVersion = "$moduleVersion-$prerelease"
          } else {
              $manifestVersion = $moduleVersion
          }

          Write-Host "Tag version:      $tagVersion"
          Write-Host "Manifest version: $manifestVersion"

          if ($tagVersion -ne $manifestVersion) {
              throw "Version mismatch: tag '$tagVersion' does not match manifest version '$manifestVersion'. Update ModuleVersion/Prerelease in .psd1 or correct the tag."
          }

          Write-Host "Version match confirmed." -ForegroundColor Green

  signature-validation:
    name: Validate Authenticode Signatures
    needs: [validate-version, resolve-tag]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}

      - name: Build module
        shell: pwsh
        run: ./Scripts/Build-Module.ps1 -SkipSigning -SkipAnalysis -Clean

      - name: Run signature compliance gate
        shell: pwsh
        run: ./Scripts/Test-SignatureCompliance.ps1 -Path './build', './Scripts'

  publish:
    needs: [signature-validation, resolve-tag]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}

      - name: Build module
        shell: pwsh
        run: ./Scripts/Build-Module.ps1 -SkipSigning -SkipAnalysis -Clean

      - name: Publish module
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Import-Module './src/CharlandCustomizations/CharlandCustomizations.psd1' -Force
          $buildDir = Get-ChildItem './build/CharlandCustomizations' -Directory | Select-Object -First 1
          $dryRun = '${{ inputs.dry_run }}' -eq 'true'
          $params = @{
              Path = $buildDir.FullName
              SkipGitValidation = $true
          }
          if ($dryRun) { $params['WhatIf'] = $true }
          ./Scripts/Publish-CharlandCustomizations.ps1 @params

  protect-tag:
    name: Lock release tag
    needs: [publish, resolve-tag]
    if: ${{ inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark tag as immutable via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ needs.resolve-tag.outputs.tag_name }}"
          echo "Protecting tag: $TAG_NAME"

          # Detect prerelease: any tag with a hyphen after the version (e.g., v0.3.0-beta)
          VERSION="${TAG_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "Prerelease: $IS_PRERELEASE"

          # Create a GitHub release for the tag, which makes it a permanent
          # annotated reference that cannot be moved or deleted without removing the release first
          gh api --method POST /repos/${{ github.repository }}/releases \
            --field tag_name="$TAG_NAME" \
            --field name="$TAG_NAME" \
            --field body="Published to PowerShell Gallery. This release is immutable." \
            --field draft=false \
            --field prerelease="$IS_PRERELEASE"

          echo "✓ Release created — tag '$TAG_NAME' is now protected as a GitHub release."
